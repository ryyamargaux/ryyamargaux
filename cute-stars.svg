<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-labelledby="title desc">
<title id="title">A tiny lavender star bunny</title><desc id="desc">A sweet hooded bunny floats among twinkling stars and glittering lavender sparkles.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#21133f"/><stop offset="1" stop-color="#4b2382"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e6c9ff" stop-opacity=".46"/><stop offset="1" stop-color="#c98cff" stop-opacity="0"/></radialGradient>
 <linearGradient id="hood" x2=".8" y2="1"><stop stop-color="#d9adff"/><stop offset=".48" stop-color="#9d5ce5"/><stop offset="1" stop-color="#5b2f9a"/></linearGradient>
 <linearGradient id="ear" x2="1" y2="1"><stop stop-color="#f7dcff"/><stop offset="1" stop-color="#b987f1"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <style>
 .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite alternate}.float{animation:float 3s ease-in-out infinite}.earL{transform-box:fill-box;transform-origin:bottom right;animation:ear 2.8s ease-in-out infinite}.earR{transform-box:fill-box;transform-origin:bottom left;animation:ear 2.8s ease-in-out -1.1s infinite}.blink{animation:blink 4s infinite}.drift{animation:drift 8s linear infinite}
 @keyframes twinkle{from{opacity:.35;transform:scale(.72) rotate(0deg)}to{opacity:1;transform:scale(1.18) rotate(24deg)}}@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-8px)}}@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
 </style>
 <path id="star" d="M0-8 2.2-2.2 8 0 2.2 2.2 0 8-2.2 2.2-8 0-2.2-2.2Z"/>
</defs>
<rect width="800" height="190" rx="24" fill="url(#night)"/><ellipse cx="400" cy="96" rx="250" ry="115" fill="url(#glow)"/>
<g fill="#fff0ff" opacity=".85"><circle cx="74" cy="44" r="1.8"/><circle cx="156" cy="135" r="1.4"/><circle cx="230" cy="38" r="1.3"/><circle cx="590" cy="34" r="1.6"/><circle cx="706" cy="66" r="1.5"/><circle cx="749" cy="145" r="1.2"/><circle cx="632" cy="136" r="1.8"/><circle cx="112" cy="104" r="1.1"/><circle cx="527" cy="157" r="1.2"/></g>
<g fill="#f5ddff"><use href="#star" x="108" y="64" class="twinkle"/><use href="#star" x="688" y="111" class="twinkle" style="animation-delay:.6s"/><use href="#star" x="242" y="145" class="twinkle" style="animation-delay:.9s"/><use href="#star" x="560" y="66" class="twinkle" style="animation-delay:.3s"/></g>
<g fill="#d993ff"><circle cx="174" cy="70" r="2" class="twinkle"/><circle cx="624" cy="95" r="2.4" class="twinkle" style="animation-delay:.4s"/><circle cx="319" cy="42" r="1.7" class="twinkle" style="animation-delay:.7s"/></g>
<g class="drift" fill="#fff7ff" opacity=".72"><path d="M0 0l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" transform="translate(320 71) scale(.65)"/><path d="M0 0l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" transform="translate(490 126) scale(.55)"/></g>
<!-- soft floating shadow --> <ellipse cx="400" cy="157" rx="57" ry="9" fill="#170d2c" opacity=".55" filter="url(#soft)"/>
<g class="float">
 <!-- long floppy bunny ears -->
 <g class="earL"><path d="M375 79C352 48 347 20 359 17c18-4 34 25 43 54" fill="url(#hood)" stroke="#e6caff" stroke-width="3"/><path d="M373 59c-11-20-16-32-11-34 7-2 17 16 23 29" fill="url(#ear)" opacity=".82"/></g>
 <g class="earR"><path d="M426 72c6-32 23-57 39-52 13 4 4 36-13 65" fill="url(#hood)" stroke="#e6caff" stroke-width="3"/><path d="M432 62c8-21 18-33 24-31 5 2-1 18-12 34" fill="url(#ear)" opacity=".82"/></g>
 <!-- round hood --> <path d="M346 102c0-35 24-59 54-63l-6 13 18-14 8 17 13-10c21 12 34 32 34 59 0 39-23 58-61 58s-60-20-60-60" fill="url(#hood)" stroke="#f2dcff" stroke-width="3"/>
 <!-- face --> <ellipse cx="400" cy="105" rx="39" ry="37" fill="#fff1fb"/>
 <!-- hood rim --> <path d="M359 104c6-23 22-36 41-36 20 0 36 13 42 36" fill="none" stroke="#e7c8ff" stroke-width="4" opacity=".9"/>
 <!-- tiny skull bow --> <g transform="translate(400 54)"><path d="M-5 0-19-10l1 17 13 1M5 0 19-10l-1 17-13 1" fill="#f8d9ff" stroke="#fff" stroke-width="1.5"/><circle r="7" fill="#fff0ff"/><circle cx="-2.5" cy="-1" r="1" fill="#6c398f"/><circle cx="2.5" cy="-1" r="1" fill="#6c398f"/><path d="M-2 2h4v2h-4z" fill="#6c398f"/></g>
 <!-- eyes and face details --> <g class="blink" style="transform-origin:384px 103px"><ellipse cx="384" cy="103" rx="4.5" ry="6.5" fill="#39234f"/><circle cx="385" cy="101" r="1.5" fill="white"/></g><g class="blink" style="transform-origin:416px 103px"><ellipse cx="416" cy="103" rx="4.5" ry="6.5" fill="#39234f"/><circle cx="417" cy="101" r="1.5" fill="white"/></g>
 <ellipse cx="374" cy="115" rx="7" ry="3.3" fill="#ffafd4" opacity=".8"/><ellipse cx="426" cy="115" rx="7" ry="3.3" fill="#ffafd4" opacity=".8"/>
 <path d="M397 114q3 4 6 0" fill="none" stroke="#9a5b8d" stroke-width="2" stroke-linecap="round"/>
 <!-- tiny paws --> <ellipse cx="374" cy="148" rx="10" ry="6" fill="#f6e1ff"/><ellipse cx="426" cy="148" rx="10" ry="6" fill="#f6e1ff"/>
</g>
<text x="400" y="181" text-anchor="middle" fill="#f2dcff" font-family="Verdana,sans-serif" font-size="10" letter-spacing="3">✦ TINY STAR BUNNY ✦</text>
</svg>
